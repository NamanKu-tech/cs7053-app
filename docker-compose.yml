services:
  backend:
    build: ./backend
    volumes:
      - ./backend/app/data:/app/app/data
      - ./materials:/materials:ro
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite:///./app/data/app.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./materials:/materials:ro
    depends_on:
      - backend
    restart: unless-stopped
